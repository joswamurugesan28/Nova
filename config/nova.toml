# NOVA default configuration.
# Override the path with the NOVA_CONFIG environment variable.
# All relative paths are resolved against the project root.

[app]
name = "NOVA"
version = "0.1.0"

[logging]
level = "INFO"
file = "logs/nova.log"
max_bytes = 1048576
backup_count = 3

[personality]
name = "NOVA"
style = "helpful, concise, honest about limitations"
system_prompt = "You are NOVA, a modular personal AI assistant. Be concise and honest about what you can and cannot do."

[models]
# Model assignments per task. Backend names: "stub" (mock) or "llama-server".
# M1-B: the real local brain is ONLINE. To switch back to mock mode without
# any code change, set: brain = "stub" (and optionally enabled = false).
brain = "llama-server"
vision = "stub"
stt = "stub"
tts = "stub"
artifact = "stub"

# llama.cpp llama-server backend (M1-B: REAL inference online).
# Runtime : ~/NOVA/tools/llama.cpp/llama-b11379/llama-server
# Model   : ~/NOVA/models/qwen3/Qwen3-4B-Instruct-2507-Q4_K_M.gguf (Q4_K_M, 2.50 GB)
# NOVA never starts or stops llama-server on its own - start it manually:
#   tools/llama.cpp/llama-b11379/llama-server \
#     -m models/qwen3/Qwen3-4B-Instruct-2507-Q4_K_M.gguf \
#     -c 4096 -np 1 -t 4 -b 1024 -ub 512 -ctk q8_0 -ctv q8_0 \
#     --host 127.0.0.1 --port 8080
[models.llama_server]
enabled = true
base_url = "http://127.0.0.1:8080"
model = "qwen3-4b"
timeout_seconds = 120
health_timeout_seconds = 2
context_size = 4096
temperature = 0.7
max_tokens = 512

[artifacts]
workspace_dir = "nova/artifacts/workspace"
templates_dir = "nova/artifacts/templates"
output_dir = "nova/artifacts/output"
max_file_mb = 50

[permissions]
auto_approve_read = true
interactive_approval = true

[audit]
file = "logs/audit.jsonl"

[apps]
enabled = ["godot"]
godot_bridge_port = 7456
godot_auto_launch = false
