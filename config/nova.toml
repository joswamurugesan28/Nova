# NOVA default configuration.
# Override the path with the NOVA_CONFIG environment variable.
# All relative paths are resolved against the project root.

[app]
name = "NOVA"
version = "0.1.0"

[logging]
level = "INFO"
file = "logs/nova.log"
max_bytes = 1048576
backup_count = 3

[personality]
name = "NOVA"
style = "helpful, concise, honest about limitations"
system_prompt = "You are NOVA, a modular personal AI assistant. Be concise and honest about what you can and cannot do."

[models]
# Model assignments per task. "stub" is a mock backend used in M0/M1-A.
# Backend names: "stub" (safe default) or "llama-server" (M1-A interface).
# Real model ids (qwen3-4b, qwen3-vl-4b, whisper, indic-f5) are wired in later milestones.
brain = "stub"
vision = "stub"
stt = "stub"
tts = "stub"
artifact = "stub"

# llama.cpp llama-server backend (M1-A: interface only).
# IMPORTANT: no model has been downloaded and no server is installed yet.
# To use this backend later: start llama-server manually with a Qwen3 4B
# GGUF, set brain = "llama-server" AND enabled = true below.
# NOVA never starts or stops llama-server on its own.
[models.llama_server]
enabled = false
base_url = "http://127.0.0.1:8080"
model = "qwen3-4b"
timeout_seconds = 120
health_timeout_seconds = 2
context_size = 4096
temperature = 0.7
max_tokens = 512

[artifacts]
workspace_dir = "nova/artifacts/workspace"
templates_dir = "nova/artifacts/templates"
output_dir = "nova/artifacts/output"
max_file_mb = 50
